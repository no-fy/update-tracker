name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The version the project targets and the image ships.
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python3 tests/test_smoke.py --offline

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The dashboard, and the agent people paste onto their hosts.
          - name: update-tracker
            dockerfile: Dockerfile
          - name: update-tracker-agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v7

      # arm64 matters here: the dashboard is happy on a NAS or a Pi.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # Pull requests build to prove the Dockerfile still works, but publish
          # nothing: a fork's token cannot write packages anyway.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
