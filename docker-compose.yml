services:
  dashboard:
    image: ghcr.io/no-fy/update-tracker:latest
    # To run your own working copy instead of the published image:
    #   docker compose up -d --build
    build: .
    pull_policy: always
    container_name: container-update-dashboard
    restart: unless-stopped
    ports:
      - "8500:8500"
    volumes:
      - cud-config:/config
      # Watching *this* machine's containers (`cud add --local`) additionally
      # needs the Docker socket, read-only, plus the socket's group below.
      # Dashboards that only poll remote agents need neither.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add:
    #   - "999"   # the host's docker gid: stat -c %g /var/run/docker.sock
    environment:
      # There is no auth by default. Set this if the port is reachable beyond
      # a trusted LAN; any username then works with this password.
      # CUD_PASSWORD: change-me
      TZ: UTC

volumes:
  cud-config:
