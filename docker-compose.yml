services:
  dashboard:
    image: ghcr.io/no-fy/update-tracker:latest
    # To run your own working copy instead of the published image:
    #   docker compose up -d --build
    build: .
    pull_policy: always
    container_name: container-update-dashboard
    restart: unless-stopped
    # Installing OS updates on this machine means running its package manager,
    # which needs the host's namespaces. Remove both lines, or set
    # CUD_ALLOW_UPDATES=0, for a dashboard that only reports what is pending.
    pid: host
    privileged: true
    ports:
      - "8500:8500"
      # WebSocket-only, for the exec/terminal feature (CUD_ALLOW_EXEC below).
      # Harmless to leave published even with exec off.
      - "8501:8501"
    volumes:
      - cud-config:/config
      # Watching this machine's own containers -- and, by default, managing
      # them (start/stop/restart, logs). The container works out the socket's
      # group id itself at startup. Set CUD_ALLOW_CONTAINER_ACTIONS=0 below for
      # a dashboard that only reports. The :ro here is not a safety boundary:
      # a Unix socket can be written to over a read-only bind mount just as
      # well, since :ro only stops the container renaming or deleting the
      # socket file itself. Drop this line if you only want to watch remote
      # hosts.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only view of the host so OS package updates can be read from the
      # package manager's own database. Drop this and CUD_HOST_ROOT below to
      # track containers only.
      - /:/host:ro
      # Historical container logs and Docker events, so they survive a
      # restart of this container. Drop this and set CUD_LOG_HISTORY=0 and
      # CUD_EVENTS=0 below to keep only what Docker itself still has.
      - cud-logs:/var/lib/container-update-agent
      # Off unless both this line and CUD_STACKS_DIR below are set --
      # "Deploy stack" needs a host path to write compose files to, and
      # it must be the *same* path on both sides for docker compose to
      # find them again once it's running via the host's own namespaces:
      # - /opt/cud-stacks:/opt/cud-stacks
    environment:
      CUD_HOST_ROOT: /host
      # There is no auth by default. Set this if the port is reachable beyond
      # a trusted LAN; any username then works with this password.
      # CUD_PASSWORD: change-me
      # Container start/stop/restart and log access are on by default.
      # CUD_ALLOW_CONTAINER_ACTIONS: "0"
      # A Terminal button (a real shell in a container) and Backup/Restore
      # buttons (a volume's actual data, not just config) are both off by
      # default -- a bigger trust boundary than the actions above, so each
      # needs its own explicit opt-in:
      # CUD_ALLOW_EXEC: "1"
      # CUD_ALLOW_VOLUME_BACKUP: "1"
      # Historical logs are on by default too, once there is somewhere to
      # put them (the cud-logs volume above). Days of history to keep:
      # CUD_LOG_RETENTION_DAYS: "7"
      # Docker events (start/stop/die/oom/health/pulls) are on by default
      # too, stored the same way. Days of history to keep:
      # CUD_EVENTS_RETENTION_DAYS: "14"
      # OS package lists refresh themselves every 6 hours by default (needs
      # the same pid/privileged access as installing updates does, above).
      # 0 turns this off; there is also a manual "Refresh package lists"
      # button per host either way.
      # CUD_OS_REFRESH_HOURS: "6"
      # "Deploy stack" is off unless this is also set to the identical
      # path as the bind mount above:
      # CUD_STACKS_DIR: /opt/cud-stacks
      # A dashboard-wide "Ask AI" assistant that can look at hosts,
      # containers, logs and OS updates -- and, with your approval, act on
      # them -- via OpenRouter (Claude Haiku by default, pick any model at
      # https://openrouter.ai/models). Easiest to set from Settings in the
      # UI instead -- these are just a fallback for when nothing is saved
      # there yet:
      # CUD_OPENROUTER_API_KEY: sk-or-...
      # CUD_OPENROUTER_MODEL: anthropic/claude-haiku-4.5
      TZ: UTC

volumes:
  cud-config:
  cud-logs:
